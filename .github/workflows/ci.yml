name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned snapshot
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.6.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install from root lockfile
        run: npm ci --ignore-scripts

      - name: Verify source, tests, generated artifacts, and docs
        run: npm test

      - name: Build production documentation
        run: npm run docs:build

      - name: Verify publishable tarballs in a blank consumer
        run: npm run test:packages

      - name: Check production dependencies
        run: npm run audit:production

      - name: Validate Compose models
        run: npm run verify:compose

      - name: Reject generated drift
        run: git diff --exit-code
