name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@12.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install from root lockfile
        run: npm ci --ignore-scripts

      - name: Verify source, tests, generated artifacts, and docs
        run: npm test

      - name: Build production documentation
        run: npm run docs:build

      - name: Verify publishable tarballs in a blank consumer
        run: npm run test:packages

      - name: Check production dependencies
        run: npm run audit:production

      - name: Validate Compose models
        run: npm run verify:compose

      - name: Reject generated drift
        run: git diff --exit-code
