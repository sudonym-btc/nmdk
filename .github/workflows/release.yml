name: Release bundle

on:
  push:
    tags: ['nmdk-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NMDK_REQUIRE_STACKS: '1'
      NMDK_TEST_SEED: nmdk-release-v1
      MARKETPLACE_TRUST_LOCAL_CA: '0'
      MARKETPLACE_EVM_RESET_ON_UP: '1'
    steps:
      - name: Checkout pinned snapshot
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.6.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install and verify
        run: |
          npm ci --ignore-scripts
          npm test
          npm run docs:build
          npm run test:packages
          npm run audit:production
          npm run verify:compose
          git diff --exit-code

      - name: Start a fresh deterministic stack
        run: npm run up

      - name: Run the release integration matrix
        run: npm run test:integration

      - name: Stop and remove stack state
        if: always()
        run: npm run down

      - name: Build release bundle and SBOM
        run: npm run release:bundle

      - name: Upload immutable release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nmdk-release-bundle
          path: artifacts/release
          if-no-files-found: error

      - name: Attest bundle provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: artifacts/release/*
