name: Release bundle

on:
  push:
    tags: ['nmdk-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NMDK_REQUIRE_STACKS: '1'
      NMDK_TEST_SEED: nmdk-release-v1
      MARKETPLACE_TRUST_LOCAL_CA: '0'
      MARKETPLACE_EVM_RESET_ON_UP: '1'
    steps:
      - name: Checkout pinned snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install pinned Docker Compose
        run: ./scripts/install-compose.sh

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@12.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install and verify
        run: |
          npm ci --ignore-scripts
          npm test
          npm run docs:build
          npm run test:packages
          npm run audit:production
          npm run verify:compose
          git diff --exit-code

      - name: Install pinned demo browser
        run: npm run demo:browser:install

      - name: Start a fresh deterministic stack
        run: npm run up

      - name: Run the release integration matrix
        run: npm run test:integration

      - name: Record the release demo and escrow dashboard
        run: npm run demo:capture

      - name: Stop and remove stack state
        if: always()
        run: npm run down

      - name: Reject runtime-generated repository drift
        run: |
          status="$(git status --porcelain --untracked-files=all --ignore-submodules=none)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Build release bundle and SBOM
        run: npm run release:bundle

      - name: Upload immutable release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nmdk-release-bundle
          path: |
            artifacts/release
            artifacts/marketplace-demo
          if-no-files-found: error

      - name: Attest bundle provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/release/*
