name: Integration

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NMDK_REQUIRE_STACKS: '1'
      NMDK_TEST_SEED: nmdk-ci-v1
      MARKETPLACE_TRUST_LOCAL_CA: '0'
      MARKETPLACE_EVM_RESET_ON_UP: '1'
    steps:
      - name: Checkout pinned snapshot
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.6.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install from root lockfile
        run: npm ci --ignore-scripts

      - name: Start a fresh deterministic stack
        run: npm run up

      - name: Run required integration matrix
        run: npm run test:integration

      - name: Show unhealthy services
        if: failure()
        run: docker ps -a

      - name: Stop and remove stack state
        if: always()
        run: npm run down
