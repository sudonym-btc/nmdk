name: Integration

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NMDK_REQUIRE_STACKS: '1'
      NMDK_TEST_SEED: nmdk-ci-v1
      MARKETPLACE_TRUST_LOCAL_CA: '0'
      MARKETPLACE_EVM_RESET_ON_UP: '1'
      NMDK_DEMO_VERIFY_REQUIRE_CLEAN: '1'
    steps:
      - name: Checkout pinned snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install pinned Docker Compose
        run: ./scripts/install-compose.sh

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@12.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Rehearse fresh install, cold stack, tests, and browser capture
        run: npm run demo:verify:fresh

      - name: Show unhealthy services
        if: failure()
        run: docker ps -a

      - name: Upload browser capture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nmdk-marketplace-demo-${{ github.run_attempt }}
          path: artifacts/marketplace-demo
          if-no-files-found: warn
          retention-days: 14

      - name: Stop and remove stack state
        if: always()
        run: npm run down
