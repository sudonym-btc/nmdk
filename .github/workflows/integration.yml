name: Integration

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NMDK_REQUIRE_STACKS: '1'
      NMDK_TEST_SEED: nmdk-ci-v1
      MARKETPLACE_TRUST_LOCAL_CA: '0'
      MARKETPLACE_EVM_RESET_ON_UP: '1'
      NMDK_DEMO_VERIFY_REQUIRE_CLEAN: '1'
    steps:
      - name: Checkout pinned snapshot
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.6.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Rehearse fresh install, cold stack, tests, and browser capture
        run: npm run demo:verify:fresh

      - name: Show unhealthy services
        if: failure()
        run: docker ps -a

      - name: Upload browser capture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nmdk-marketplace-demo-${{ github.run_attempt }}
          path: artifacts/marketplace-demo
          if-no-files-found: warn
          retention-days: 14

      - name: Stop and remove stack state
        if: always()
        run: npm run down
