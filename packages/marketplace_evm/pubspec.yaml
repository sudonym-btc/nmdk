name: marketplace_evm
description: NMDK EVM escrow and Lightning swap driver for Dart.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.13.0
dependencies:
  marketplace_models:
    path: ../marketplace_models
  bloc: ^9.2.1
  bolt11_decoder: ^1.0.2
  chopper: ^8.7.0
  collection: ^1.19.1
  convert: ^3.1.2
  crypto: ^3.0.7
  eip712: ^1.0.1
  http: ^1.6.0
  injectable: ^3.0.0
  json_annotation: ^4.12.0
  logger: ^2.8.0
  logging: ^1.3.0
  meta: ^1.19.0
  ndk: ^0.9.3
  opentelemetry: ^0.18.11
  permissionless: ^0.4.1
  rxdart: ^0.28.0
  # NDK 0.9.3 requires hooks 1; sqlite3 3.6 requires hooks 2.
  sqlite3: ^3.5.2
  wallet: ^0.0.18
  web3dart: ^3.0.3
  web_socket_channel: ^3.0.3
dev_dependencies:
  build_runner: ^2.16.1
  chopper_generator: ^8.7.0
  json_serializable: ^6.14.1
  lints: ^6.1.0
  swagger_dart_code_generator: ^4.1.1
  test: ^1.32.0
  # Published 3.0.1 pins build 2/dart_style 2; this upstream branch supports current builders.
  web3dart_builders:
    git:
      url: https://github.com/PatrickGeyer/web3dart_builders.git
      ref: 8622bd2cd434c6a6cad827265c52ec43457027f5

# Coinlib 5 uses only RIPEMD160Digest.process, unchanged in PointyCastle 4.
# Web3dart 3 and wallet 0.0.18 require PointyCastle 4.
dependency_overrides:
  pointycastle: ^4.0.0
