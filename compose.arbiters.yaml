x-cashu-mints: &cashu-mints '[{"mintUrl":"https://mint.cashu.marketplace.test","unit":"sat","denomination":"SAT","decimals":0,"auctionKeysetPolicies":[{"keysetId":"01884a74bb2fc5ee6e5f958f89f9e4e6cf79241fbc9fd1012d6811b054a78beffe","activeUntil":4102444800}]},{"mintUrl":"https://mint-usd.cashu.marketplace.test","unit":"usd","denomination":"USD","decimals":2,"auctionKeysetPolicies":[{"keysetId":"01c355765b93d05e852e9f1808f70287099b17cca64baeef17bfc9fc4249354377","activeUntil":4102444800}]}]'

x-arbiter-common: &arbiter-common
  image: oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
  working_dir: /workspace
  entrypoint: ["bun"]
  restart: unless-stopped
  env_file:
    - ./.nmdk.local.env
  environment:
    NODE_ENV: development
    MARKETPLACE_ARBITER_MANIFEST: /workspace/data/seed/marketplace-seed.json
    MARKETPLACE_ARBITER_STATE_DIR: /var/lib/nmdk-arbiter
    MARKETPLACE_EVM_STACK_CONFIG: /workspace/dependencies/marketplace-evm-stack/data/config/marketplace-evm-stack.json
    VITE_RELAYS: ws://relay.marketplace.test
    VITE_NIP46_RELAYS: ws://relay.marketplace.test
    VITE_EVM_RPC_URL: http://arbitrum.evm.marketplace.test
    VITE_EVM_BOLTZ_API_URL: http://boltz.evm.marketplace.test/v2
    VITE_EVM_BUNDLER_URL: http://bundler.evm.marketplace.test
    VITE_EVM_PAYMASTER_URL: http://paymaster.evm.marketplace.test
    VITE_CASHU_MINT_URL: https://mint.cashu.marketplace.test
    VITE_CASHU_MINTS: *cashu-mints
    MARKETPLACE_CASHU_PUBLIC_MINT_URL: https://mint.cashu.marketplace.test
    MARKETPLACE_CASHU_PUBLIC_USD_MINT_URL: https://mint-usd.cashu.marketplace.test
    MARKETPLACE_CASHU_MINTS: *cashu-mints
  extra_hosts:
    - host.docker.internal:host-gateway
  networks:
    - cashu
    - evm

services:
  arbiter-evm:
    <<: *arbiter-common
    container_name: nmdk-arbiter-evm
    volumes:
      - ./:/workspace:ro
      - arbiter-evm-state:/var/lib/nmdk-arbiter
    command:
      - dependencies/marketplace-app-ts/arbiter.ts
      - --account=arbiterEvm
      - --name=NMDK EVM Arbiter
      - --policy=evm-escrow
      - --policy=evm-auction
      - --relay=ws://relay.marketplace.test
      - --no-service

  arbiter-cashu:
    <<: *arbiter-common
    container_name: nmdk-arbiter-cashu
    volumes:
      - ./:/workspace:ro
      - arbiter-cashu-state:/var/lib/nmdk-arbiter
    command:
      - dependencies/marketplace-app-ts/arbiter.ts
      - --account=arbiterCashu
      - --name=NMDK Cashu Arbiter
      - --policy=cashu-escrow
      - --policy=cashu-auction
      - --relay=ws://relay.marketplace.test
      - --no-service

  arbiter-both:
    <<: *arbiter-common
    container_name: nmdk-arbiter-both
    volumes:
      - ./:/workspace:ro
      - arbiter-both-state:/var/lib/nmdk-arbiter
    command:
      - dependencies/marketplace-app-ts/arbiter.ts
      - --account=arbiterBoth
      - --name=NMDK Multi Arbiter
      - --policy=evm-escrow
      - --policy=evm-auction
      - --policy=cashu-escrow
      - --policy=cashu-auction
      - --relay=ws://relay.marketplace.test
      - --no-service

networks:
  cashu:
    external: true
    name: marketplace-cashu-stack_default
  evm:
    external: true
    name: ${MARKETPLACE_SHARED_BITCOIN_NETWORK:-nmdk-marketplace_default}

volumes:
  arbiter-evm-state:
  arbiter-cashu-state:
  arbiter-both-state:
